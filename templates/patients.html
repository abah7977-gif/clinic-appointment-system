{% extends "base.html" %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">

  <div>
    <h2 class="mb-0">Patients</h2>
    <span class="text-muted">
      Search and view patient appointment history
    </span>
  </div>

  <form class="d-flex" method="get">

    <input
      class="form-control me-2"
      name="q"
      value="{{ search }}"
      placeholder="Patient ID, name or phone"
    >

    <button class="btn btn-outline-primary">
      Search
    </button>

  </form>

</div>


<div class="card">

  <div class="table-responsive">

    <table class="table table-hover mb-0">

      <thead>

        <tr>
          <th>Patient ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>History</th>
        </tr>

      </thead>

      <tbody>

      {% for p in patients %}

      <tr>

        <td>
          {{ p.patient_no }}
        </td>

        <td>
          {{ p.name }}
        </td>

        <td>
          {{ p.phone or '-' }}
        </td>

        <td>

          <a
            class="btn btn-sm btn-outline-primary"
            href="{{ url_for('patient_detail', patient_id=p.id) }}"
          >
            View
          </a>

        </td>

      </tr>

      {% else %}

      <tr>

        <td
          colspan="4"
          class="text-center py-4 text-muted"
        >
          No patients found.
        </td>

      </tr>

      {% endfor %}

      </tbody>

    </table>

  </div>

</div>

{% endblock %}
